[workspace]
resolver = "3"
members = ["crates/domain", "crates/crypto", "crates/app", "crates/admin"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
crypto = { path = "crates/crypto" }

# Dioxus fullstack
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }

# Serialisation, errors, ids, time
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4", "serde", "js"] }
chrono = { version = "0.4.45", features = ["serde"] }

# Server
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation"] }
tower-sessions = "0.15.0"
tower-sessions-sqlx-store = { version = "0.16.0", features = ["postgres"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Crypto
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
sha2 = "0.11.1"
rand = "0.10.4"
base64 = "0.23.1"
zeroize = { version = "1.9.2", features = ["derive"] }

# CLI and QR codes
clap = { version = "4.6.8", features = ["derive"] }
qrcode = "0.15.0"

# Browser glue (web-sys features are added by the glue task)
web-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
