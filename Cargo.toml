[workspace]
resolver = "3"
members = ["crates/domain", "crates/crypto", "crates/store", "crates/app", "crates/admin", "crates/theme", "crates/export"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace.dependencies]
# Internal crates
domain = { path = "crates/domain" }
crypto = { path = "crates/crypto" }
store = { path = "crates/store" }
theme = { path = "crates/theme" }
export = { path = "crates/export" }

# Dioxus fullstack
dioxus = { version = "0.7.10", features = ["fullstack", "router"] }

# Serialisation, errors, ids, time
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
uuid = { version = "1.29.3", features = ["v4", "serde", "js"] }
chrono = { version = "0.4.45", features = ["serde"] }
chrono-tz = "0.10.4"
toml = "1.2.1"

# Server
tokio = { version = "1.54.1", features = ["full"] }
axum = "0.8.9"
sqlx = { version = "0.9.1", default-features = false, features = ["postgres", "runtime-tokio", "tls-rustls", "uuid", "chrono", "json", "migrate", "macros"] }
webauthn-rs = { version = "0.6.2", features = ["danger-allow-state-serialisation", "conditional-ui"] }
tower-sessions = "0.15.0"
tower-sessions-sqlx-store = { version = "0.16.0", features = ["postgres"] }
anyhow = "1.0.104"
tracing = "0.1.44"
utoipa = { version = "6.0.0", features = ["uuid", "chrono"] }
utoipa-axum = "0.3.0"
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

# Crypto
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
sha2 = "0.11.1"
rand = "0.10.4"
base64 = "0.23.1"
zeroize = { version = "1.9.2", features = ["derive"] }

# Payroll export
csv = "1.4.0"
encoding_rs = "0.8.44"
rust_xlsxwriter = { version = "0.104.0", features = ["chrono"] }
calamine = "0.38.0"

# Colour scheme generation
material-colors = "0.5"

# CLI and QR codes
clap = { version = "4.6.8", features = ["derive"] }
qrcode = "0.15.0"

# Browser glue (web-sys features are added by the glue task)
web-sys = "0.3.107"
wasm-bindgen = "0.2.130"
wasm-bindgen-futures = "0.4.80"
js-sys = "0.3.107"
webauthn-rs-proto = { version = "0.6.2", features = ["wasm"] }
