[package]
name = "app"
description = "Dioxus fullstack time registration app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Server-only dependencies
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
tower-sessions-sqlx-store = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
crypto = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dioxus/web"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:webauthn-rs",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:crypto",
]
