[package]
name = "app"
description = "Dioxus fullstack time registration app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }

# Server-only dependencies
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
tower-sessions-sqlx-store = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
crypto = { workspace = true, optional = true }
domain = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
chrono = { workspace = true, optional = true }

# Browser-only dependencies (glue)
web-sys = { workspace = true, optional = true, features = [
    "Window", "Navigator", "Event", "EventTarget", "MediaQueryList",
    "Geolocation", "PositionOptions", "Position", "Coordinates", "PositionError",
    "CredentialsContainer", "Credential", "PublicKeyCredential",
    "CredentialCreationOptions", "CredentialRequestOptions",
] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
webauthn-rs-proto = { workspace = true, optional = true }

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures", "dep:webauthn-rs-proto"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:webauthn-rs",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:crypto",
    "dep:domain",
    "dep:anyhow",
    "dep:chrono",
]
