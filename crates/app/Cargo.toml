[package]
name = "app"
description = "Dioxus fullstack time registration app"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
dioxus = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
# Shared with the client: DTOs use domain enums and chrono timestamps
domain = { workspace = true }
chrono = { workspace = true }
# Colour scheme generation: the server serves /theme.css, the browser previews it
theme = { workspace = true }
# Localisation: Fluent messages embedded at compile time, checked by fl!
i18n-embed = { version = "0.16.0", features = ["fluent-system", "web-sys-requester"] }
i18n-embed-fl = "0.10.1"
rust-embed = { version = "8.14.0", features = ["debug-embed"] }

# Server-only dependencies
axum = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
sqlx = { workspace = true, optional = true }
webauthn-rs = { workspace = true, optional = true }
tower-sessions = { workspace = true, optional = true }
tower-sessions-sqlx-store = { workspace = true, optional = true }
export = { workspace = true, optional = true }
base64 = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
crypto = { workspace = true, optional = true }
store = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
chrono-tz = { workspace = true, optional = true }
qrcode = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
utoipa-axum = { workspace = true, optional = true }

# Browser-only dependencies (glue)
web-sys = { workspace = true, optional = true, features = [
    "Window", "Navigator", "Event", "EventTarget", "MediaQueryList",
    "Geolocation", "PositionOptions", "Position", "Coordinates", "PositionError",
    "CredentialsContainer", "Credential", "PublicKeyCredential",
    "CredentialCreationOptions", "CredentialRequestOptions",
    "ServiceWorkerContainer", "Location", "History", "Document", "Element", "Storage",
    "Blob", "BlobPropertyBag", "Url", "HtmlAnchorElement", "HtmlElement", "Node", "Clipboard",
] }
js-sys = { workspace = true, optional = true }
wasm-bindgen = { workspace = true, optional = true }
wasm-bindgen-futures = { workspace = true, optional = true }
webauthn-rs-proto = { workspace = true }

[features]
default = ["web"]
web = ["dioxus/web", "dep:web-sys", "dep:js-sys", "dep:wasm-bindgen", "dep:wasm-bindgen-futures"]
server = [
    "dioxus/server",
    "dep:axum",
    "dep:tokio",
    "dep:sqlx",
    "dep:webauthn-rs",
    "dep:tower-sessions",
    "dep:tower-sessions-sqlx-store",
    "dep:tracing",
    "dep:tracing-subscriber",
    "dep:crypto",
    "dep:store",
    "dep:export",
    "dep:base64",
    "dep:anyhow",
    "dep:chrono-tz",
    "dep:qrcode",
    "dep:reqwest",
    "dep:utoipa",
    "dep:utoipa-axum",
]

[dev-dependencies]
webauthn-authenticator-rs = { version = "0.6.2", default-features = false, features = ["softpasskey"] }
tower = { version = "0.5.3", features = ["util"] }
